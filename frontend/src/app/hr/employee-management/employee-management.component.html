<div class="flex h-screen bg-gray-100 overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar
    [sidebarOpen]="sidebarOpen"
    [isMobile]="isMobile"
    [activeSection]="activeSection"
    [sidebarItems]="sidebarItems"
    (toggleSidebarEvent)="toggleSidebar()"
    (setActiveSectionEvent)="setActiveSection($event)"
    (logoutEvent)="logout()"
    class="h-screen">
  </app-sidebar>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Header -->
    <app-header
      (toggleSidebarClicked)="toggleSidebar()"
      (logoutClicked)="logout()"
    >
      <span section-title>{{ getSectionTitle() }}</span>
      <span subsection-title>Employee Management</span>
    </app-header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-orange-50">
      <div class="p-4 lg:p-8">
        <!-- Action Buttons -->
        <div class="flex flex-wrap gap-3 mb-8 ">
          <button (click)="exportToCSV()" 
                  class="inline-flex items-center px-6 py-3 bg-teal-500 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Export CSV
          </button>

          <button (click)="viewMode = viewMode === 'table' ? 'cards' : 'table'" 
                  class="inline-flex items-center px-4 py-3 bg-white text-gray-700 border-2 border-gray-200 font-semibold rounded-xl shadow-md hover:shadow-lg transform hover:scale-105 transition-all duration-200">
            <svg *ngIf="viewMode === 'table'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <svg *ngIf="viewMode === 'cards'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
        </div>

        <!-- Filters Section -->
        <div class="mb-6 bg-white rounded-xl p-6 shadow-lg border border-gray-200 relative z-10">
          <div class="flex flex-col md:flex-row gap-6 items-end">
            <div class="flex-1">
              <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
              <input type="text" 
                     [ngModel]="searchTerm" 
                     (input)="applyFilters()"
                     (ngModelChange)="onSearch($event)"
                     placeholder="Search by name, email, department..."
                     class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            
            <div class="w-full md:w-48">
              <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
              <select [ngModel]="selectedDepartment" 
                      (ngModelChange)="onDepartmentChange($event)"
                      class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <option value="">All Departments</option>
                <option *ngFor="let dept of departments" [value]="dept">{{dept}}</option>
              </select>
            </div>

            <div class="w-full md:w-48">
              <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
              <select [ngModel]="selectedStatus" 
                      (ngModelChange)="onStatusChange($event)"
                      class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <option value="">All Statuses</option>
                <option value="active">Active</option>
                <option value="onleave">On Leave</option>
                <option value="terminated">Terminated</option>
              </select>
            </div>

            <div class="w-full md:w-48">
              <label class="block text-sm font-medium text-gray-700 mb-2">Position</label>
              <select [ngModel]="selectedPosition" 
                      (ngModelChange)="onPositionChange($event)"
                      class="w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <option value="">All Positions</option>
                <option *ngFor="let pos of positions" [value]="pos">{{pos}}</option>
              </select>
            </div>

            <div class="w-full md:w-auto">
              <button type="button"
                      (click)="clearFilters()" 
                      class="w-full md:w-auto px-6 py-2.5 bg-gray-100 text-gray-700 rounded-lg cursor-pointer hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors duration-200 font-medium">
                Clear Filters
              </button>
            </div>
          </div>
        </div>

        <!-- Add Employee Form -->
        <div *ngIf="showForm" class="mb-10 bg-white rounded-xl p-6 shadow-lg border border-gray-200">
          <app-employee-form (submitted)="handleFormSubmit($event)" [form]="employeeForm" (cancel)="showForm = false"></app-employee-form>
        </div>

        <!-- Employee List (Table or Cards) -->
        <div *ngIf="viewMode === 'table'" class="relative">
          <div *ngIf="isLoading" class="absolute inset-0 bg-white/50 flex items-center justify-center z-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
          </div>
          <app-employee-table [employees]="filteredEmployees" (edit)="editEmployee($event)" (delete)="deleteEmployee($event)"></app-employee-table>
        </div>

        <div *ngIf="viewMode === 'cards'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 relative">
          <div *ngIf="isLoading" class="absolute inset-0 bg-white/50 flex items-center justify-center z-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
          </div>
          <app-employee-card *ngFor="let employee of paginatedEmployees"
                           [employee]="employee"
                           (edit)="editEmployee(employee)"
                           (delete)="deleteEmployee(employee.id)">
          </app-employee-card>
        </div>
      </div>
    </main>
  </div>
</div>
