<div class="flex h-screen bg-gray-100 overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar
    [sidebarOpen]="sidebarOpen"
    [isMobile]="isMobile"
    [activeSection]="activeSection"
    [sidebarItems]="sidebarItems"
    (toggleSidebarEvent)="toggleSidebar()"
    (setActiveSectionEvent)="setActiveSection($event)"
    class="h-screen">
  </app-sidebar>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Header -->
    <app-header
      (toggleSidebarClicked)="toggleSidebar()"
      (logoutClicked)="onLogout()"
    >
      <span section-title>{{ getSectionTitle() }}</span>
      <span subsection-title>Admin System Logs</span>
    </app-header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto">
      <div class="w-full max-w-5xl mx-auto px-2 sm:px-4 min-h-screen flex flex-col items-center justify-center">
        <div class="w-full bg-white rounded-lg shadow p-6 mt-6">
          <div class="mb-8 grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-blue-50 rounded-xl p-6 flex flex-col items-center shadow border border-blue-100">
              <div class="text-3xl font-bold text-blue-700 mb-1">{{ logs.length }}</div>
              <div class="text-sm text-blue-800 font-semibold">Total Logs</div>
            </div>
            <div class="bg-green-50 rounded-xl p-6 flex flex-col items-center shadow border border-green-100">
              <div class="text-3xl font-bold text-green-700 mb-1">{{ logs[0].timestamp || '-' }}</div>
              <div class="text-sm text-green-800 font-semibold">Most Recent</div>
            </div>
          </div>
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-800">System Logs</h2>
            <input [(ngModel)]="searchTerm" placeholder="Search logs..." class="p-2 border rounded w-64" />
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 bg-white rounded-lg shadow">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"><i class="fas fa-file-alt mr-1"></i>Message</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"><i class="fas fa-clock mr-1"></i>Timestamp</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let log of paginatedLogs">
                  <td class="px-6 py-4 whitespace-nowrap text-gray-900">{{ log.message }}</td>
                  <td class="px-6 py-4 whitespace-nowrap text-gray-700">{{ log.timestamp }}</td>
                </tr>
                <tr *ngIf="paginatedLogs.length === 0">
                  <td colspan="2" class="text-center text-gray-400 py-8">No logs to display.</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="flex justify-between items-center mt-4">
            <button (click)="prevPage()" [disabled]="currentPage === 1" class="px-3 py-1 bg-gray-200 rounded">Prev</button>
            <span>Page {{ currentPage }} of {{ totalPages }}</span>
            <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="px-3 py-1 bg-gray-200 rounded">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
