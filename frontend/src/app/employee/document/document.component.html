<div class="flex h-screen bg-gray-100 overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar
    [sidebarOpen]="sidebarOpen"
    [isMobile]="isMobile"
    [activeSection]="activeSection"
    [sidebarItems]="sidebarItems"
    (toggleSidebarEvent)="toggleSidebar()"
    (setActiveSectionEvent)="setActiveSection($event)"
    (logoutEvent)="logout()"
    class="h-screen">
  </app-sidebar>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Header -->
    <app-header
      (toggleSidebarClicked)="toggleSidebar()"
      (logoutClicked)="logout()"
    >
      <span section-title>{{ getSectionTitle() }}</span>
      <span subsection-title>Documents</span>
    </app-header>

    <!-- Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto">
      <div class="min-h-screen  bg-orange-50 p-4 lg:p-8">
        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
          <div class="flex flex-col md:flex-row md:items-center md:space-x-4 space-y-4 md:space-y-0">
            <div class="flex-1">
              <input type="text"
                     (input)="onSearch($event)"
                     placeholder="Search documents..."
                     class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex space-x-4">
              <select (change)="onCategoryChange($event)"
                      class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Categories</option>
                <option *ngFor="let category of categories" [value]="category">
                  {{category}}
                </option>
              </select>
              <div class="flex space-x-2">
                <button (click)="onSortChange('name')"
                        class="px-4 py-2 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        [class.bg-blue-50]="sortBy === 'name'">
                  Name
                  <i *ngIf="sortBy === 'name'" 
                     [class]="'fas fa-sort-' + (sortOrder === 'asc' ? 'up' : 'down') + ' ml-1'"></i>
                </button>
                <button (click)="onSortChange('date')"
                        class="px-4 py-2 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        [class.bg-blue-50]="sortBy === 'date'">
                  Date
                  <i *ngIf="sortBy === 'date'" 
                     [class]="'fas fa-sort-' + (sortOrder === 'asc' ? 'up' : 'down') + ' ml-1'"></i>
                </button>
                <button (click)="onSortChange('size')"
                        class="px-4 py-2 border rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        [class.bg-blue-50]="sortBy === 'size'">
                  Size
                  <i *ngIf="sortBy === 'size'" 
                     [class]="'fas fa-sort-' + (sortOrder === 'asc' ? 'up' : 'down') + ' ml-1'"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Document List -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Size</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Upload Date</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Version</th>
                  <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let doc of filteredDocuments" class="hover:bg-gray-50">
                  <td class="px-6 py-4 whitespace-nowrap">
                    <div class="flex items-center">
                      <i class="fas fa-file-pdf text-red-500 w-5 h-5 mr-2"></i>
                      <div class="text-sm font-medium text-gray-900">{{doc.name}}</div>
                    </div>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                      {{doc.category}}
                    </span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{doc.type}}</td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{formatFileSize(doc.size)}}</td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    {{doc.uploadDate | date:'mediumDate'}}
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{doc.version}}</td>
                  <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <button (click)="downloadDocument(doc)"
                            class="text-blue-600 hover:text-blue-900 focus:outline-none">
                      <i class="fas fa-download mr-1"></i>
                      Download
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div> 

<app-chatbot></app-chatbot>
